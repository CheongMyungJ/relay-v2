# 설치 파일 (I8): NSIS, x64, 사용자별 설치(관리자 권한 불필요), 서명 없음. 자동 업데이트는 GitHub Releases (I95).
# 설치 위치는 %LOCALAPPDATA%\Programs\relay, 실행 파일은 relay.exe다.
# Linux는 .deb, x64 (D350, I103). 설치 위치는 /opt/relay, 실행 파일은 /opt/relay/relay(/usr/bin/relay로 링크)다.
appId: io.github.cheongmyungj.relay
productName: relay
directories:
  output: dist
files:
  - out/**
  - package.json
# 네이티브 모듈을 Electron용으로 다시 빌드하지 않고 node-pty의 N-API 사전 빌드를 그대로 쓴다.
# M0 [스모크]가 이것이 설치된 앱에서 로드되는지 확인한다 (docs/implementation.md 3절).
npmRebuild: false
asar: true
# node-pty의 .node, conpty.dll, OpenConsole.exe는 실제 파일이어야 한다 (I32).
# electron-builder도 네이티브 파일이 있는 모듈을 자동으로 풀지만 명시해 둔다.
asarUnpack:
  - node_modules/node-pty/**
# 스킬 원본은 앱에 함께 넣는다 (I7, D103). 앱은 M2부터 resources/skills를 읽는다.
extraResources:
  - from: scripts/codex-hook.ps1
    to: codex-hook.ps1
  - from: scripts/codex-bridge.mjs
    to: codex-bridge.mjs
  - from: ../skills
    to: skills
    filter:
      - _common.md
      - '*/**'
      - '!node_modules/**'
# 자동 업데이트 (I95): 앱에 app-update.yml을 넣고 dist/에 latest.yml을 만든다.
# 올리기는 app-release 워크플로가 gh로 하므로 빌드는 늘 --publish never로 한다.
# app-build 결과물(0.0.0)에도 들어가지만 앱이 0.0.0에서는 업데이트를 켜지 않는다(main/update).
publish:
  provider: github
  owner: CheongMyungJ
  repo: relay-v2
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  artifactName: relay-setup-${version}.${ext}
# Linux (D350, I103). .deb 설치 스크립트가 chrome-sandbox 권한과 Ubuntu 24.04+의 AppArmor 프로필을 맞춘다.
# 설치 파일 이름은 기본값 relay_<버전>_amd64.deb이고, resources/package-type(deb)으로 업데이터가 형식을 안다(I105).
linux:
  target:
    - target: deb
      arch: [x64]
  executableName: relay
  # package.json의 desktopName(relay.desktop)과 .desktop 파일 이름, Electron의 app_id를 맞춰 창이 메뉴 항목과 묶이게 한다
  syncDesktopName: true
  category: Development
  synopsis: 단계마다 결과를 보고 승인하며 Claude Code에게 일을 맡기는 데스크톱 앱
  description: 단계마다 결과를 보고 승인하며 Claude Code에게 일을 맡기는 데스크톱 앱
  maintainer: CheongMyungJ <101340453+CheongMyungJ@users.noreply.github.com>
deb:
  # electron-builder 기본 의존성에 git을 더한다. relay는 worktree 때문에 git이 필수다(7절)
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git
