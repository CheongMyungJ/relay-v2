# 설치 파일 (I8): NSIS, x64, 사용자별 설치(관리자 권한 불필요), 서명과 자동 업데이트 없음.
# 설치 위치는 %LOCALAPPDATA%\Programs\relay, 실행 파일은 relay.exe다.
appId: io.github.cheongmyungj.relay
productName: relay
directories:
  output: dist
files:
  - out/**
  - package.json
# 네이티브 모듈을 Electron용으로 다시 빌드하지 않고 node-pty의 N-API 사전 빌드를 그대로 쓴다.
# M0 [스모크]가 이것이 설치된 앱에서 로드되는지 확인한다 (docs/implementation.md 3절).
npmRebuild: false
asar: true
# node-pty의 .node, conpty.dll, OpenConsole.exe는 실제 파일이어야 한다 (I32).
# electron-builder도 네이티브 파일이 있는 모듈을 자동으로 풀지만 명시해 둔다.
asarUnpack:
  - node_modules/node-pty/**
# 스킬 원본은 앱에 함께 넣는다 (I7, D103). 앱은 M2부터 resources/skills를 읽는다.
extraResources:
  - from: ../skills
    to: skills
    filter:
      - _common.md
      - '*/**'
      - '!node_modules/**'
publish: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  artifactName: relay-setup-${version}.${ext}
