# Claude Code를 네이티브 설치 스크립트로 설치하고 PATH에 더한다. app-claude의 claude, pr(pr-auto), contract 작업이 함께 쓴다.
# version을 주면 그 버전으로 고정하고, 깔린 claude --version이 그 버전인지 확인한다. 정기 실행이 "확인한 버전"으로 남기는
# 버전(plan의 npm latest)과 실제로 시험한 버전이 어긋나지 않게 한다 (docs/implementation.md 8.3).
# 설치 스크립트에는 토큰을 넘기지 않는다.
name: install-claude
description: Claude Code를 설치하고 버전을 확인한다 (Linux, Windows)
inputs:
  version:
    description: 설치할 Claude Code 버전. 비우면 설치 스크립트의 기본(latest)
    required: false
    default: ""
  onboarding:
    description: 따로 만든 설정 폴더(CLAUDE_CONFIG_DIR)에 hasCompletedOnboarding을 더해 대화형 온보딩을 건너뛴다 (8.4, Linux)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: 설치 (Linux)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL https://claude.ai/install.sh | env -u GH_TOKEN -u CLAUDE_CODE_OAUTH_TOKEN -u ANTHROPIC_API_KEY bash -s ${VERSION:+"$VERSION"}
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "CLAUDE_INSTALLED=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

    - name: 설치 (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $script = [scriptblock]::Create((irm https://claude.ai/install.ps1))
        if ($env:VERSION) { & $script $env:VERSION } else { & $script }
        "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "CLAUDE_INSTALLED=$env:USERPROFILE\.local\bin\claude.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: 버전 확인 (Linux)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        got=$(env -u GH_TOKEN "$CLAUDE_INSTALLED" --version)
        echo "Claude Code: $got"
        if [ -n "$VERSION" ] && [ "${got%% *}" != "$VERSION" ]; then
          echo "::error::설치된 Claude Code($got)가 요청한 버전($VERSION)과 다릅니다."
          exit 1
        fi

    - name: 버전 확인 (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $got = (& $env:CLAUDE_INSTALLED --version | Out-String).Trim()
        "Claude Code: $got"
        if ($env:VERSION -and ($got -split ' ')[0] -ne $env:VERSION) {
          Write-Error "설치된 Claude Code($got)가 요청한 버전($env:VERSION)과 다릅니다."
          exit 1
        }

    - name: 설정 폴더 (대화형 온보딩을 건너뜀)
      # 따로 만든 설정 폴더의 .claude.json에 hasCompletedOnboarding만 더한다 (docs/implementation.md 8.4, spikes/README.md)
      if: ${{ inputs.onboarding == 'true' && runner.os != 'Windows' }}
      shell: bash
      run: |
        dir="$RUNNER_TEMP/claude-config"
        mkdir -p "$dir"
        CLAUDE_CONFIG_DIR="$dir" env -u GH_TOKEN "$CLAUDE_INSTALLED" --version
        node -e 'const fs = require("fs"); const f = process.argv[1]; const j = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {}; j.hasCompletedOnboarding = true; fs.writeFileSync(f, JSON.stringify(j, null, 2));' "$dir/.claude.json"
        echo "CLAUDE_CONFIG_DIR=$dir" >> "$GITHUB_ENV"
