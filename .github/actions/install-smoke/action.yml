# 설치본 [스모크] (docs/implementation.md I8, I27, I95). app-build와 app-release가 함께 쓴다.
# 설치 파일을 러너에 조용히 설치하고, 자동 업데이트 설정과 asar 밖의 node-pty 파일을 확인한 뒤, 설치한 앱으로 [스모크]를 돈다.
# 같은 [스모크]를 개발 빌드로는 app-ci가 push마다 돈다.
name: install-smoke
description: 설치 파일을 조용히 설치하고 설치본으로 [스모크]를 돈다 (Windows)
inputs:
  setup:
    description: app/ 기준 설치 파일 경로
    required: true
runs:
  using: composite
  steps:
    - name: 조용한 설치
      shell: pwsh
      working-directory: app
      env:
        SETUP: ${{ inputs.setup }}
      run: |
        if (-not (Test-Path $env:SETUP)) { Write-Error "설치 파일이 없습니다: $env:SETUP"; exit 1 }
        Start-Process -FilePath (Resolve-Path $env:SETUP).Path -ArgumentList '/S' -Wait
        $exe = Join-Path $env:LOCALAPPDATA 'Programs\relay\relay.exe'
        if (-not (Test-Path $exe)) { Write-Error "설치된 실행 파일이 없습니다: $exe"; exit 1 }
        $update = Join-Path $env:LOCALAPPDATA 'Programs\relay\resources\app-update.yml'
        if (-not (Test-Path $update)) { Write-Error "자동 업데이트 설정이 없습니다: $update"; exit 1 }
        "RELAY_APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "설치 위치: $exe"

    - name: 설치된 node-pty 파일 확인 (asar 밖)
      shell: pwsh
      run: |
        $pty = Join-Path (Split-Path $env:RELAY_APP_EXE) 'resources\app.asar.unpacked\node_modules\node-pty\prebuilds\win32-x64'
        $missing = @('conpty.node', 'conpty\conpty.dll', 'conpty\OpenConsole.exe') | Where-Object { -not (Test-Path (Join-Path $pty $_)) }
        Get-ChildItem -Recurse $pty | Select-Object FullName, Length | Format-Table -AutoSize
        if ($missing) { Write-Error "없는 파일: $($missing -join ', ')"; exit 1 }

    - name: "[스모크] 설치본"
      shell: pwsh
      working-directory: app
      run: npm run test:smoke
