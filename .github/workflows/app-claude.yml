# [실제] 실제 claude로 두 요청(경우 이름 M, S)이 intake → fix → verify를 지나 Work 완료까지 가는지, 트리 종료한 세션을 --resume으로 다시 열면
# 대화가 이어지는지(M3), 되감기 뒤 스킬이 추가 지시와 폐기된 시도 요약을 따라 Work 완료까지 가는지(M4),
# 전달과 정리(M5), 앱이 충돌한 뒤 다시 켜서 [재개]로 이어 가는지(M6), 수정 단계를 카운트다운 뒤 자동 승인하는지(M7),
# 작은 기능 추가가 intake → design → implement → verify를 지나는지(경우 feature, M14),
# 작은 리팩터링이 intake → refactor → verify를 지나는지(경우 refactor, M15),
# 작은 일반 Work가 intake → execute → verify를 지나는지(경우 general, M18)
# 본다 (docs/implementation.md I29, 8.3, 8.4).
# 수동으로만 실행한다. Claude 사용량이 든다. 마일스톤을 마칠 때와 Claude Code를 올릴 때 돌린다.
# 인증: spikes 워크플로와 같은 레포 secret CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY.
# cases에 pr이나 pr-cleanup만 적으면 Linux 작업(pr)이 가짜 claude와 실제 gh로 PR 진행(M9)과 PR 대응의 push, 답글 게시,
# 다시 실행(M10, I53)을 시험용 레포에서 돈다.
# 이때는 Claude 인증 없이 시험용 레포 secret RELAY_TEST_GH_REPO, RELAY_TEST_GH_TOKEN만 쓴다 (I43, I49).
# cases의 pr-auto는 같은 Linux 작업이 실제 claude와 실제 gh를 합쳐 자동 대응(M11)을 돈다. 이때만 Claude 인증 secret을
# 작업에 넣고 Claude Code를 설치한다 (I55). pr, pr-cleanup과 함께 적을 수 있다.
# 결과는 실행 요약과 claude-results 결과물에 올라가고, 사람이 docs/checks.md에 옮긴다 (I30).
# [계약] 실제 쪽(경우 contract, Linux 작업 contract): 실제 claude(haiku)와 실제 gh가 계약과 녹화본(app/test/contract)대로인지
# 본다. claude는 사용량이 조금 들고 gh는 시험용 레포를 읽기만 한다. update_contract를 켜면 녹화본을 새로 써서 결과물에 올린다.
# 정기 실행(schedule): 매주 [실제] 전부(Windows)와 [계약]. 매일 Claude Code의 새 버전을 확인해 처음 보는 버전이면 [계약]과
# [실제] S를 돌리고, 통과하면 그 버전을 확인한 것으로 남긴다(actions 캐시 claude-code-tested-<버전>). 정기 실행이 실패하면
# 이슈를 연다(같은 제목의 열린 이슈가 있으면 코멘트를 단다). PR을 막지 않는다 (docs/implementation.md 8.1, 8.3).
name: app-claude

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude Code 모델 (별칭 또는 모델 이름)"
        required: false
        default: "sonnet"
      effort:
        description: "effort 수준 (low / medium / high / xhigh). 비용을 아끼려고 기본은 low"
        required: false
        default: "low"
      cases:
        description: "돌릴 경우 (예: S resume rewind-fix restart feature refactor general). rewind는 rewind-intake와 rewind-fix. 비우면 전부. pr, pr-cleanup, pr-auto는 따로(PR 진행과 대응, Linux). contract는 [계약] 실제 쪽(Linux)"
        required: false
        default: ""
      update_contract:
        description: "[계약]의 녹화본을 새로 써서 결과물(contract-fixtures)에 올린다"
        type: boolean
        required: false
        default: false
  schedule:
    # GitHub Actions의 cron은 UTC다
    - cron: "52 18 * * 0" # 매주 월요일 03:52 KST: [실제] 전부(Windows)와 [계약]
    - cron: "37 19 * * *" # 매일 04:37 KST: Claude Code 새 버전 확인

permissions:
  contents: read

# 실제 claude 시험이 겹쳐 돌지 않게 한다
concurrency:
  group: app-claude
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      claude: ${{ steps.plan.outputs.claude }}
      cases: ${{ steps.plan.outputs.cases }}
      contract: ${{ steps.plan.outputs.contract }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Claude Code 최신 버전
        id: latest
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - name: 확인한 버전인지 (매일)
        id: tested
        if: ${{ github.event.schedule == '37 19 * * *' }}
        uses: actions/cache/restore@v4
        with:
          path: .claude-code-tested
          key: claude-code-tested-${{ steps.latest.outputs.version }}
          lookup-only: true

      - name: 무엇을 돌릴지
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CASES: ${{ inputs.cases }}
          HIT: ${{ steps.tested.outputs.cache-hit }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          claude=false; contract=false; cases=""
          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE" = "52 18 * * 0" ]; then
              claude=true; contract=true
            elif [ "$HIT" != true ]; then
              # 처음 보는 Claude Code 버전: [계약]과 짧은 [실제] 하나
              claude=true; contract=true; cases="S"
            fi
          else
            words=" $CASES "
            case "$words" in *" contract "*) contract=true ;; esac
            rest=$(echo "$CASES" | tr ' ' '\n' | grep -vx contract | tr '\n' ' ' | xargs || true)
            # pr, pr-cleanup, pr-auto가 들어 있으면 Linux 작업(pr)이 맡는다. contract만 적었으면 Windows 작업은 돌지 않는다
            case " $rest " in
              *" pr "*|*" pr-cleanup "*|*" pr-auto "*) ;;
              *) if [ "$contract" != true ] || [ -n "$rest" ]; then claude=true; fi ;;
            esac
            cases="$rest"
          fi
          echo "버전 $VERSION, 확인함 ${HIT:-모름} → claude=$claude cases='$cases' contract=$contract"
          {
            echo "claude=$claude"
            echo "cases=$cases"
            echo "contract=$contract"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  claude:
    needs: plan
    if: ${{ needs.plan.outputs.claude == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # 둘 다 있으면 구독 토큰만 쓴다. API 키가 함께 있으면 Claude Code가 키 승인 창을 띄울 수 있다.
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
      # 앱이 PTY에 넘기는 환경 변수로 모델과 effort를 정한다 (Claude Code 문서 model-config, env-vars).
      # 정기 실행에는 입력이 없어 기본값을 쓴다
      ANTHROPIC_MODEL: ${{ inputs.model || 'sonnet' }}
      CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort || 'low' }}
      RELAY_REAL_CLAUDE: "1"
      RELAY_REAL_CASES: ${{ needs.plan.outputs.cases }}
    steps:
      - uses: actions/checkout@v4

      - name: 인증 secret 확인
        run: |
          if (-not $env:CLAUDE_CODE_OAUTH_TOKEN -and -not $env:ANTHROPIC_API_KEY) {
            Write-Error "CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY secret이 필요합니다."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Claude Code 설치 (네이티브 설치 스크립트)
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Claude Code 버전
        run: claude --version

      - name: 인증 상태 (등록 점검 D67과 같은 명령)
        # 실패해도 다음 단계에서 등록 점검이 막으며 이유를 남긴다
        continue-on-error: true
        run: claude auth status

      - name: 앱 의존성 설치
        working-directory: app
        env:
          # [실제]는 Node에서 돌아 Electron 바이너리가 필요 없다 (I26)
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "[실제]"
        working-directory: app
        run: npm run test:claude

      - name: 결과 요약
        if: always()
        working-directory: app
        run: |
          foreach ($name in @('summary.md', 'resume.md', 'rewind.md', 'deliver.md', 'restart.md', 'auto.md', 'feature.md', 'refactor.md', 'general.md')) {
            $file = "test-results/claude/$name"
            if (Test-Path $file) {
              Get-Content $file -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-results-${{ github.sha }}
          path: app/test-results/claude/
          if-no-files-found: warn

  pr:
    # PR 진행(M9, I49)과 PR 대응(M10, I53): 가짜 claude와 실제 gh로 돈다. gh와 GitHub의 동작은 OS와 상관없어 Linux에서 한다
    # (S7과 같음). 시험용 레포의 main에서 임시 기준 브랜치 m9/<run>/base를 만들어 거기에 PR을 연다(I48).
    # 자동 대응(M11, pr-auto)은 대응 task만 실제 claude다 (I55).
    if: ${{ contains(format(' {0} ', inputs.cases), ' pr ') || contains(format(' {0} ', inputs.cases), ' pr-cleanup ') || contains(format(' {0} ', inputs.cases), ' pr-auto ') }}
    runs-on: ubuntu-latest
    # 시험의 기한(test/claude/pr.test.ts, 50분)보다 길게 둔다. 작업이 제한에 걸려 끊기면 시험 PR과 브랜치 정리가 돌지 못한다
    timeout-minutes: 60
    env:
      RELAY_TEST_GH_REPO: ${{ secrets.RELAY_TEST_GH_REPO }}
      GH_TOKEN: ${{ secrets.RELAY_TEST_GH_TOKEN }}
      RELAY_REAL_GH: "1"
      RELAY_REAL_CASES: ${{ inputs.cases }}
      # pr-auto만 실제 claude를 쓴다. 다른 경우에는 Claude 인증을 작업에 넣지 않는다 (I55)
      RELAY_REAL_CLAUDE: ${{ contains(format(' {0} ', inputs.cases), ' pr-auto ') && '1' || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ contains(format(' {0} ', inputs.cases), ' pr-auto ') && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
      # 둘 다 있으면 구독 토큰만 쓴다 (claude 작업과 같음)
      ANTHROPIC_API_KEY: ${{ contains(format(' {0} ', inputs.cases), ' pr-auto ') && secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
      ANTHROPIC_MODEL: ${{ inputs.model || 'sonnet' }}
      CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort || 'low' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 시험용 레포 secret 확인
        run: |
          if [ -z "$RELAY_TEST_GH_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::RELAY_TEST_GH_REPO와 RELAY_TEST_GH_TOKEN secret이 필요합니다 (docs/implementation.md I43)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: gh 버전
        run: gh --version

      - name: Claude 인증 secret 확인 (pr-auto)
        if: ${{ contains(format(' {0} ', inputs.cases), ' pr-auto ') }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::pr-auto에는 CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY secret이 필요합니다 (docs/implementation.md I55)."
            exit 1
          fi

      - name: Claude Code 설치 (pr-auto, 네이티브 설치 스크립트)
        if: ${{ contains(format(' {0} ', inputs.cases), ' pr-auto ') }}
        # 설치 스크립트에는 토큰을 넘기지 않는다
        run: |
          curl -fsSL https://claude.ai/install.sh | env -u GH_TOKEN -u CLAUDE_CODE_OAUTH_TOKEN -u ANTHROPIC_API_KEY bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code 설정 폴더 (pr-auto, 대화형 온보딩을 건너뜀)
        # 따로 만든 설정 폴더의 .claude.json에 hasCompletedOnboarding만 더한다 (docs/implementation.md 8.4, spikes/README.md)
        if: ${{ contains(format(' {0} ', inputs.cases), ' pr-auto ') }}
        run: |
          dir="$RUNNER_TEMP/claude-config"
          mkdir -p "$dir"
          CLAUDE_CONFIG_DIR="$dir" env -u GH_TOKEN claude --version
          node -e 'const fs = require("fs"); const f = process.argv[1]; const j = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {}; j.hasCompletedOnboarding = true; fs.writeFileSync(f, JSON.stringify(j, null, 2));' "$dir/.claude.json"
          echo "CLAUDE_CONFIG_DIR=$dir" >> "$GITHUB_ENV"

      - name: 앱 의존성 설치
        working-directory: app
        env:
          # [실제]는 Node에서 돌아 Electron 바이너리가 필요 없다 (I26)
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "[실제] PR 진행과 대응"
        working-directory: app
        run: npm run test:claude

      - name: 결과 요약
        if: always()
        working-directory: app
        run: |
          for name in pr-cleanup.md pr.md pr-auto.md; do
            file="test-results/claude/$name"
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-pr-results-${{ github.sha }}
          path: app/test-results/claude/
          if-no-files-found: warn

  contract:
    # [계약] 실제 쪽 (8.1). claude는 haiku로 짧게 돌고, gh는 시험용 레포를 읽기만 한다(I43)
    needs: plan
    if: ${{ needs.plan.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
      RELAY_TEST_GH_REPO: ${{ secrets.RELAY_TEST_GH_REPO }}
      GH_TOKEN: ${{ secrets.RELAY_TEST_GH_TOKEN }}
      RELAY_CONTRACT_LIVE: "1"
      RELAY_CONTRACT_LIVE_GH: "1"
      RELAY_CONTRACT_UPDATE: ${{ inputs.update_contract && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: secret 확인
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY secret이 필요합니다."
            exit 1
          fi
          if [ -z "$RELAY_TEST_GH_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::RELAY_TEST_GH_REPO와 RELAY_TEST_GH_TOKEN secret이 필요합니다 (docs/implementation.md I43)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Claude Code 설치 (네이티브 설치 스크립트)
        # 설치 스크립트에는 토큰을 넘기지 않는다
        run: |
          curl -fsSL https://claude.ai/install.sh | env -u GH_TOKEN -u CLAUDE_CODE_OAUTH_TOKEN -u ANTHROPIC_API_KEY bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 버전
        run: |
          claude --version
          gh --version

      - name: 앱 의존성 설치
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "[계약] 실제 claude와 실제 gh"
        working-directory: app
        run: npm run test:contract

      - name: 결과 요약
        if: always()
        working-directory: app
        run: |
          for name in live.md live-gh.md; do
            file="test-results/contract/$name"
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: 녹화본 올리기 (update_contract)
        if: ${{ always() && inputs.update_contract }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-fixtures
          path: app/test/contract/fixtures/
          if-no-files-found: error

  remember:
    # 매일 확인에서 처음 본 버전이 [계약]과 [실제] S를 통과하면 확인한 것으로 남긴다
    needs: [plan, claude, contract]
    if: ${{ github.event.schedule == '37 19 * * *' && needs.claude.result == 'success' && needs.contract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "${{ needs.plan.outputs.version }}" > .claude-code-tested
      - uses: actions/cache/save@v4
        with:
          path: .claude-code-tested
          key: claude-code-tested-${{ needs.plan.outputs.version }}

  report:
    # 정기 실행이 실패하면 이슈를 연다. PR을 막지 않으므로 여기서 알린다
    needs: [plan, claude, contract]
    if: ${{ always() && github.event_name == 'schedule' && (needs.claude.result == 'failure' || needs.contract.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "정기 [실제]·[계약] 실패"
      BODY: |
        정기 실행이 실패했습니다: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - 일정: `${{ github.event.schedule }}`, Claude Code ${{ needs.plan.outputs.version }}
        - [실제](claude): ${{ needs.claude.result }}, [계약](contract): ${{ needs.contract.result }}
    steps:
      - name: 이슈 열기 또는 코멘트
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
