# 앱 CI (docs/implementation.md I28, 8.3).
# Linux: 타입 검사, ESLint, Prettier, [단위], skills/check.mjs. Windows: 빌드(I39), [어댑터], [흐름].
# Windows의 [흐름]은 PR 진행·대응(test/flow/pr*.test.ts)과 나머지를 두 작업으로 나눠 함께 돈다. 작업마다 20분 제한이다 (I54).
name: app-ci

on:
  push:
    paths:
      - "app/**"
      - "skills/**"
      - "docs/contracts/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "skills/**"
      - "docs/contracts/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 앱 의존성 설치
        working-directory: app
        # Linux 작업은 node-pty와 Electron 바이너리가 필요 없어 설치 스크립트를 건너뛴다.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 타입 검사
        working-directory: app
        run: npm run typecheck

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: Prettier
        working-directory: app
        run: npm run format:check

      - name: "[단위]"
        working-directory: app
        run: npm run test:unit

      - name: 스킬 정적 검사
        working-directory: skills
        run: |
          npm ci --no-audit --no-fund
          node check.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 앱 의존성 설치
        working-directory: app
        # Codex 질문창과 Electron Node 모드 브리지의 GUI 스모크에도 쓴다.
        run: npm ci --no-audit --no-fund

      - name: Electron 실행 파일 준비
        working-directory: app
        # CI의 npm 설치 정책과 무관하게 새 브리지·GUI 검사의 실행 파일을 보장한다.
        run: node node_modules/electron/install.js

      - name: 빌드
        working-directory: app
        # 파일 이름의 대소문자를 가리지 않는 Windows에서만 깨지는 import를 push마다 잡는다 (I39, A79)
        run: npm run build

      - name: "[어댑터]"
        working-directory: app
        run: npm run test:adapters

      - name: "[Codex 흐름] 실제 command·MCP 브리지"
        working-directory: app
        # 새 Windows 실행 경로의 실패를 전체 흐름 시험보다 먼저 확인한다.
        run: npm run test:flow -- test/flow/codex.test.ts

      - name: "[Codex GUI 스모크] 개발 빌드"
        working-directory: app
        # 실제 모델 호출 없이 설정 → 앱 질문창 → 답변 → 다음 엔진 전환을 검증한다.
        # 설치본 자체는 app-build의 기존 스모크에서 별도로 검증한다.
        run: npx playwright test test/smoke/codex.spec.ts

      - name: "[흐름] (PR 진행·대응·Codex 밖)"
        working-directory: app
        run: npm run test:flow -- --exclude "test/flow/pr*.test.ts" --exclude "test/flow/codex.test.ts"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: codex-smoke-windows
          path: app/test-results/
          if-no-files-found: ignore

  windows-pr:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 앱 의존성 설치
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "[흐름] PR 진행·대응"
        working-directory: app
        run: npm run test:flow -- test/flow/pr
