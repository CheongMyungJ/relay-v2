# 앱 CI (docs/implementation.md I28, 8.3).
# Linux: 타입 검사, ESLint, Prettier, [단위], skills/check.mjs. Windows: 빌드(I39), [어댑터], [흐름].
# Windows의 [흐름]은 PR 진행·대응(test/flow/pr*.test.ts)과 나머지를 두 작업으로 나눠 함께 돈다. 작업마다 20분 제한이다 (I54).
name: app-ci

on:
  push:
    paths:
      - "app/**"
      - "skills/**"
      - "docs/contracts/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "skills/**"
      - "docs/contracts/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 앱 의존성 설치
        working-directory: app
        # Linux 작업은 node-pty와 Electron 바이너리가 필요 없어 설치 스크립트를 건너뛴다.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 타입 검사
        working-directory: app
        run: npm run typecheck

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: Prettier
        working-directory: app
        run: npm run format:check

      - name: "[단위]"
        working-directory: app
        run: npm run test:unit

      - name: 스킬 정적 검사
        working-directory: skills
        run: |
          npm ci --no-audit --no-fund
          node check.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 앱 의존성 설치
        working-directory: app
        env:
          # 어댑터와 흐름 시험은 Node에서 돌아 Electron 바이너리가 필요 없다 (I26).
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: 빌드
        working-directory: app
        # 파일 이름의 대소문자를 가리지 않는 Windows에서만 깨지는 import를 push마다 잡는다 (I39, A79)
        run: npm run build

      - name: "[어댑터]"
        working-directory: app
        run: npm run test:adapters

      - name: "[흐름] (PR 진행·대응 밖)"
        working-directory: app
        run: npm run test:flow -- --exclude "test/flow/pr*.test.ts"

  windows-pr:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 앱 의존성 설치
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: "[흐름] PR 진행·대응"
        working-directory: app
        run: npm run test:flow -- test/flow/pr
