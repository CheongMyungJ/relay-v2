# relay-v2 스파이크 (docs/spikes.md)를 러너에서 돌린다.
# S1~S6: Windows 러너. 인증은 레포 secret CLAUDE_CODE_OAUTH_TOKEN(구독, `claude setup-token`으로 발급) 또는 ANTHROPIC_API_KEY(Console 과금).
# S7(GitHub 연동): spikes 입력에 S7만 적으면 Linux 러너에서 돈다. Claude 인증은 쓰지 않고, 시험용 레포 secret
# RELAY_TEST_GH_REPO(owner/repo)와 RELAY_TEST_GH_TOKEN을 쓴다(docs/implementation.md I43, I47).
name: spikes

on:
  workflow_dispatch:
    inputs:
      spikes:
        description: "돌릴 스파이크 (예: S2 S3). 비우면 S7을 뺀 전부 (S5, S1, S2, S3, S3B, S4, S6 순서). S7은 S7만 적는다"
        required: false
        default: ""
      model:
        description: "Claude Code 모델 (별칭 또는 모델 이름)"
        required: false
        default: "sonnet"
      effort:
        description: "effort 수준 (low / medium / high / xhigh). 비용을 아끼려고 기본은 low"
        required: false
        default: "low"
      s7:
        description: "S7 단계: start(시험 PR을 만들고 사람의 코멘트를 기다림) / finish(s7_pr 필요) / cleanup(남은 s7/ 브랜치와 열린 시험 PR 정리)"
        type: choice
        options: [start, finish, cleanup]
        default: start
      s7_pr:
        description: "S7 finish에서 이어 갈 시험 PR 번호"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  spikes:
    if: inputs.spikes != 'S7'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # 둘 다 있으면 구독 토큰만 쓴다. API 키가 함께 있으면 Claude Code가 키 승인 창을 띄울 수 있다.
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
      SPIKE_MODEL: ${{ inputs.model }}
      CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort }}
    steps:
      - uses: actions/checkout@v4

      - name: 인증 secret 확인
        run: |
          if (-not $env:CLAUDE_CODE_OAUTH_TOKEN -and -not $env:ANTHROPIC_API_KEY) {
            Write-Error "CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY secret이 필요합니다."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code 설치 (네이티브 설치 스크립트)
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Claude Code 버전
        run: claude --version

      - name: 인증 확인 (비대화형 한 번)
        # 인증이 안 되면 스파이크를 돌려도 의미가 없으므로 먼저 확인하고 멈춘다.
        timeout-minutes: 3
        run: claude -p "READY 라고만 답해." --model $env:SPIKE_MODEL

      - name: 스파이크 의존성 설치
        working-directory: spikes
        run: npm ci --no-audit --no-fund

      - name: 스파이크 실행
        working-directory: spikes
        run: node run.mjs ${{ inputs.spikes }}

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-results
          path: |
            spikes/results/
            spikes/work/**/*.log
          if-no-files-found: warn

  s7:
    if: inputs.spikes == 'S7'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELAY_TEST_GH_REPO: ${{ secrets.RELAY_TEST_GH_REPO }}
      GH_TOKEN: ${{ secrets.RELAY_TEST_GH_TOKEN }}
      S7_PHASE: ${{ inputs.s7 }}
      S7_PR: ${{ inputs.s7_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 시험용 레포 secret 확인
        run: |
          if [ -z "$RELAY_TEST_GH_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::RELAY_TEST_GH_REPO와 RELAY_TEST_GH_TOKEN secret이 필요합니다 (docs/implementation.md I43)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: gh 버전
        run: gh --version

      # S7은 Node 내장 모듈과 gh, git만 쓴다. 스파이크 의존성(node-pty)은 설치하지 않는다.
      - name: S7
        working-directory: spikes
        run: node run.mjs S7

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-s7-results
          path: spikes/results/
          if-no-files-found: warn
